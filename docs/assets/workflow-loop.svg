<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Permission-first engineering loop</title>
  <desc id="desc">The Full Stack HQ workflow moves from inspection to scope, approval, implementation, verification, and reporting.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61708a"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="18" fill="#0b0f14"/>
  <rect x="1" y="1" width="1198" height="248" rx="17" fill="none" stroke="#273142" stroke-width="2"/>
  <text x="48" y="48" fill="#e6edf3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="600">Permission-first engineering loop</text>
  <text x="48" y="75" fill="#91a0b5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Each implementation stays scoped, reviewable, and verifiable.</text>

  <line x1="190" y1="148" x2="224" y2="148" stroke="#61708a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="148" x2="414" y2="148" stroke="#61708a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="148" x2="604" y2="148" stroke="#61708a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="148" x2="794" y2="148" stroke="#61708a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="148" x2="984" y2="148" stroke="#61708a" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="40" y="113" width="150" height="70" rx="12" fill="#151d29" stroke="#79b8ff" stroke-width="2"/>
    <text x="115" y="140" fill="#79b8ff" font-size="12" letter-spacing="1">01</text>
    <text x="115" y="162" fill="#e6edf3" font-size="15" font-weight="600">Inspect</text>

    <rect x="230" y="113" width="150" height="70" rx="12" fill="#151d29" stroke="#79b8ff" stroke-width="2"/>
    <text x="305" y="140" fill="#79b8ff" font-size="12" letter-spacing="1">02</text>
    <text x="305" y="162" fill="#e6edf3" font-size="15" font-weight="600">Scope</text>

    <rect x="420" y="113" width="150" height="70" rx="12" fill="#191526" stroke="#bb9af7" stroke-width="2"/>
    <text x="495" y="140" fill="#bb9af7" font-size="12" letter-spacing="1">03</text>
    <text x="495" y="162" fill="#e6edf3" font-size="15" font-weight="600">Approval</text>

    <rect x="610" y="113" width="150" height="70" rx="12" fill="#171921" stroke="#f6c177" stroke-width="2"/>
    <text x="685" y="140" fill="#f6c177" font-size="12" letter-spacing="1">04</text>
    <text x="685" y="162" fill="#e6edf3" font-size="15" font-weight="600">Implement</text>

    <rect x="800" y="113" width="150" height="70" rx="12" fill="#101b22" stroke="#70d6a4" stroke-width="2"/>
    <text x="875" y="140" fill="#70d6a4" font-size="12" letter-spacing="1">05</text>
    <text x="875" y="162" fill="#e6edf3" font-size="15" font-weight="600">Verify</text>

    <rect x="990" y="113" width="150" height="70" rx="12" fill="#101b22" stroke="#70d6a4" stroke-width="2"/>
    <text x="1065" y="140" fill="#70d6a4" font-size="12" letter-spacing="1">06</text>
    <text x="1065" y="162" fill="#e6edf3" font-size="15" font-weight="600">Report</text>
  </g>
  <text x="600" y="218" text-anchor="middle" fill="#91a0b5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">one reversible slice at a time</text>
</svg>
