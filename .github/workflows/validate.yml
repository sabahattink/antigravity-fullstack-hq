name: Validate configuration

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\validate.ps1

      - name: Validate with Bash
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/validate.sh
