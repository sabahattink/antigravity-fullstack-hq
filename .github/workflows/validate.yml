name: Validate configuration

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\validate.ps1

      - name: Validate with Bash
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/validate.sh

      - name: Run Windows installation smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\smoke-test.ps1

      - name: Run Bash installation smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke-test.sh

  claude-plugin:
    name: Claude Code plugin manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate marketplace and plugin manifests
        shell: bash
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.289 plugin validate .claude-plugin/marketplace.json --strict
          npx --yes @anthropic-ai/claude-code@2.1.289 plugin validate .claude-plugin/plugin.json --strict
