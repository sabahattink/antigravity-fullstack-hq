name: Validate configuration

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\validate.ps1

      - name: Validate with Bash
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/validate.sh

      - name: Run Windows installation smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\smoke-test.ps1

      - name: Run Bash installation smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke-test.sh
